language:
  language: [auto, zh, en]
  locale: [auto, zh-CN, zh-TW, en-US, en-GB]
  selection: [explicit, profile, inferred]
audience:
  role: [auto, executive, engineer, product, general, academic]
  expertise: [auto, beginner, intermediate, advanced, expert]
  context: string
  familiarity: [auto, low, medium, high]
dimensions:
  range: [0, 100]
  names: [structure, tone, skepticism, humanity, literary, humor, precision, density, persuasion, calmness, directness, narrative]
constraint_strength: [soft, strong, hard]
profile_constraint:
  bounds: {min: [0, 100], max: [0, 100]}
  avoid: [string]
  default_strength: strong
  explicit_user_style_value: overrides_bound_and_records_conflict
  hard_task_constraint: cannot_be_overridden
